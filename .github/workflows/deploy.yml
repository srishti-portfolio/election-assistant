name: Deploy ElectIQ to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: cd backend && python -m pytest tests/ -v --tb=short || echo "No tests yet"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npx tsc --noEmit
      - name: Build
        run: cd frontend && npm run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker --quiet
      - name: Build & Deploy Backend
        run: |
          docker build -t gcr.io/$PROJECT_ID/electiq-backend:$GITHUB_SHA ./backend
          docker push gcr.io/$PROJECT_ID/electiq-backend:$GITHUB_SHA
          BACKEND_URL=$(gcloud run deploy electiq-backend \
            --image gcr.io/$PROJECT_ID/electiq-backend:$GITHUB_SHA \
            --platform managed --region $REGION --allow-unauthenticated \
            --memory 512Mi \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --format "value(status.url)" --quiet)
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
      - name: Build & Deploy Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ env.BACKEND_URL }} \
            -t gcr.io/$PROJECT_ID/electiq-frontend:$GITHUB_SHA ./frontend
          docker push gcr.io/$PROJECT_ID/electiq-frontend:$GITHUB_SHA
          gcloud run deploy electiq-frontend \
            --image gcr.io/$PROJECT_ID/electiq-frontend:$GITHUB_SHA \
            --platform managed --region $REGION --allow-unauthenticated \
            --memory 256Mi --quiet
      - name: Post deployment summary
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** ${{ env.BACKEND_URL }}" >> $GITHUB_STEP_SUMMARY